name: Build profile

on:
  schedule:
    # 06:20 UTC daily — after the previous day's contributions have settled
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/templates/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fails the run if any translated string outgrows the box it sits in.
      - name: Render panels and READMEs
        run: node scripts/build.mjs

      - name: Render GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/stats.mjs

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to update"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh generated profile assets"
          git push
