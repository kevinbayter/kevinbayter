<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="AI reads, code computes: dual-pass LLM extraction feeding a fully deterministic calculation engine">
  <title>AI reads. Code computes.</title>

  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <linearGradient id="fSplit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="fArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <clipPath id="fClip"><rect width="1200" height="660" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#fClip)">
    <rect width="1200" height="660" fill="url(#fBg)"/>
    <rect x="0.5" y="0.5" width="1199" height="659" rx="18" fill="none" stroke="#1E293B"/>

    <!-- header -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <circle cx="40" cy="42" r="5" fill="#F87171"/>
      <circle cx="58" cy="42" r="5" fill="#FBBF24"/>
      <circle cx="76" cy="42" r="5" fill="#34D399"/>
      <text x="98" y="47" font-size="14" fill="#64748B">regulated-domain AI platform</text>
      <text x="36" y="90" font-size="24" font-weight="700" fill="#E2E8F0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">AI reads. Code computes.</text>
      <text x="36" y="114" font-size="13" fill="#64748B">language models never touch the number that matters &#8212; they only propose what a human confirms</text>
    </g>

    <!-- ============ TOP: the AI half ============ -->
    <text x="36" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#A78BFA">PROBABILISTIC &#183; EXTRACTION</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <!-- documents -->
      <g>
        <rect x="36" y="166" width="168" height="140" rx="12" fill="#0F172A" stroke="#4C1D95"/>
        <g>
          <rect x="56" y="188" width="60" height="76" rx="6" fill="#111827" stroke="#334155"/>
          <rect x="64" y="200" width="40" height="3" rx="1.5" fill="#334155"/>
          <rect x="64" y="210" width="32" height="3" rx="1.5" fill="#334155"/>
          <rect x="64" y="220" width="44" height="3" rx="1.5" fill="#334155"/>
          <rect x="64" y="230" width="28" height="3" rx="1.5" fill="#334155"/>
          <!-- scanning beam -->
          <rect x="58" y="190" width="56" height="2" fill="#A78BFA" opacity="0.9">
            <animate attributeName="y" values="190;258;190" dur="3.4s" repeatCount="indefinite"/>
          </rect>
        </g>
        <g>
          <rect x="126" y="188" width="60" height="76" rx="6" fill="#111827" stroke="#334155"/>
          <rect x="134" y="200" width="44" height="3" rx="1.5" fill="#334155"/>
          <rect x="134" y="210" width="36" height="3" rx="1.5" fill="#334155"/>
          <rect x="134" y="220" width="40" height="3" rx="1.5" fill="#334155"/>
          <rect x="134" y="230" width="24" height="3" rx="1.5" fill="#334155"/>
          <rect x="128" y="190" width="56" height="2" fill="#38BDF8" opacity="0.9">
            <animate attributeName="y" values="190;258;190" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
          </rect>
        </g>
        <text x="56" y="288" font-size="10.5" fill="#64748B">statements &#183; certificates</text>
      </g>

      <!-- arrows into the two passes -->
      <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#fArrow)">
        <path d="M204 214 C230 214, 226 196, 250 196"/>
        <path d="M204 258 C230 258, 226 276, 250 276"/>
      </g>

      <!-- pass 1 -->
      <g>
        <rect x="256" y="166" width="212" height="60" rx="10" fill="#0F172A" stroke="#4C1D95"/>
        <text x="272" y="190" font-size="12.5" font-weight="600" fill="#E2E8F0">Pass 1 &#183; extract</text>
        <text x="272" y="210" font-size="10.5" fill="#64748B">schema-validated output</text>
        <circle cx="450" cy="182" r="4" fill="#A78BFA">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- pass 2 -->
      <g>
        <rect x="256" y="246" width="212" height="60" rx="10" fill="#0F172A" stroke="#155E75"/>
        <text x="272" y="270" font-size="12.5" font-weight="600" fill="#E2E8F0">Pass 2 &#183; re-read</text>
        <text x="272" y="290" font-size="10.5" fill="#64748B">no shared context with pass 1</text>
        <circle cx="450" cy="262" r="4" fill="#38BDF8">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- converge to comparator -->
      <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#fArrow)">
        <path d="M468 196 C500 196, 496 218, 520 224"/>
        <path d="M468 276 C500 276, 496 254, 520 248"/>
      </g>

      <!-- comparator -->
      <g>
        <path d="M576 200 L616 236 L576 272 L536 236 Z" fill="#0F172A" stroke="#FBBF24"/>
        <path d="M576 200 L616 236 L576 272 L536 236 Z" fill="none" stroke="#FBBF24" opacity="0">
          <animate attributeName="opacity" values="0;0.9;0;0" keyTimes="0;0.2;0.4;1" dur="4s" repeatCount="indefinite"/>
        </path>
        <text x="576" y="233" font-size="10" fill="#FDE68A" text-anchor="middle">agree</text>
        <text x="576" y="246" font-size="10" fill="#FDE68A" text-anchor="middle">?</text>
      </g>

      <!-- to human confirm -->
      <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#fArrow)">
        <path d="M616 236 L660 236"/>
      </g>

      <!-- human confirm -->
      <g>
        <rect x="666" y="178" width="230" height="120" rx="12" fill="#0F172A" stroke="#065F46"/>
        <text x="686" y="210" font-size="12.5" font-weight="600" fill="#E2E8F0">Human confirms each value</text>
        <text x="686" y="230" font-size="10.5" fill="#64748B">mismatches surface first,</text>
        <g>
          <rect x="686" y="256" width="190" height="10" rx="5" fill="#111827"/>
          <rect x="686" y="256" width="0" height="10" rx="5" fill="#065F46">
            <animate attributeName="width" values="0;190;190;0" keyTimes="0;0.6;0.9;1" dur="6s" repeatCount="indefinite"/>
          </rect>
        </g>
        <text x="686" y="246" font-size="10.5" fill="#64748B">with the source alongside</text>
        <text x="686" y="286" font-size="10.5" fill="#34D399">nothing advances unconfirmed</text>
      </g>

      <!-- guided interview -->
      <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#fArrow)">
        <path d="M896 236 L940 236"/>
      </g>
      <g>
        <rect x="946" y="178" width="218" height="120" rx="12" fill="#0F172A" stroke="#1E3A8A"/>
        <text x="966" y="210" font-size="12.5" font-weight="600" fill="#E2E8F0">Adaptive interview</text>
        <text x="966" y="230" font-size="10.5" fill="#64748B">only what is still unanswered</text>
        <g font-size="10.5" fill="#94A3B8">
          <text x="966" y="252" opacity="0">&#8250; mortgage interest this year?<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" repeatCount="indefinite"/></text>
          <text x="966" y="252" opacity="0">&#8250; any dependants to declare?<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.41;0.62;0.67;1" dur="9s" repeatCount="indefinite"/></text>
          <text x="966" y="252" opacity="0">&#8250; voluntary pension top-ups?<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.75;0.96;1" dur="9s" repeatCount="indefinite"/></text>
        </g>
        <text x="966" y="286" font-size="10.5" fill="#64748B">answers become facts</text>
      </g>
    </g>

    <!-- ============ the boundary ============ -->
    <g>
      <line x1="36" y1="330" x2="1164" y2="330" stroke="#1E293B" stroke-width="1" stroke-dasharray="6 6"/>
      <rect x="36" y="329" width="240" height="2" fill="url(#fSplit)">
        <animate attributeName="x" values="36;924;36" dur="7s" repeatCount="indefinite"/>
      </rect>
      <rect x="404" y="316" width="392" height="28" rx="14" fill="#0B1120" stroke="#334155"/>
      <text x="600" y="335" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">
        the model&#8217;s job ends here &#8212; nothing below is generated
      </text>
    </g>

    <!-- ============ BOTTOM: the deterministic half ============ -->
    <text x="36" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#34D399">DETERMINISTIC &#183; CALCULATION</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <!-- engine -->
      <rect x="36" y="380" width="700" height="248" rx="12" fill="#0B1120" stroke="#065F46"/>
      <text x="56" y="406" font-size="13.5" font-weight="600" fill="#E2E8F0">Pure calculation core &#183; zero dependencies</text>
      <text x="56" y="426" font-size="10.5" fill="#64748B">every rule carries the citation that backs it &#183; same input, same output, forever</text>

      <g font-size="11">
        <g>
          <rect x="56" y="442" width="660" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
          <rect x="56" y="442" width="660" height="30" rx="6" fill="none" stroke="#34D399" opacity="0">
            <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.16;1" dur="8s" repeatCount="indefinite"/>
          </rect>
          <circle cx="74" cy="457" r="3.5" fill="#34D399"/>
          <text x="92" y="461" fill="#CBD5E1">income buckets classified and netted</text>
          <rect x="560" y="448" width="144" height="18" rx="9" fill="#052E2B"/>
          <text x="574" y="461" font-size="9.5" fill="#5EEAD4">statute &#167; cited in-repo</text>
        </g>
        <g>
          <rect x="56" y="480" width="660" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
          <rect x="56" y="480" width="660" height="30" rx="6" fill="none" stroke="#34D399" opacity="0">
            <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.20;0.26;0.36;1" dur="8s" repeatCount="indefinite"/>
          </rect>
          <circle cx="74" cy="495" r="3.5" fill="#34D399"/>
          <text x="92" y="499" fill="#CBD5E1">deductions applied, then capped by the legal limits</text>
          <rect x="560" y="486" width="144" height="18" rx="9" fill="#052E2B"/>
          <text x="574" y="499" font-size="9.5" fill="#5EEAD4">statute &#167; cited in-repo</text>
        </g>
        <g>
          <rect x="56" y="518" width="660" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
          <rect x="56" y="518" width="660" height="30" rx="6" fill="none" stroke="#34D399" opacity="0">
            <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.40;0.46;0.56;1" dur="8s" repeatCount="indefinite"/>
          </rect>
          <circle cx="74" cy="533" r="3.5" fill="#34D399"/>
          <text x="92" y="537" fill="#CBD5E1">progressive rate table &#183; integer arithmetic, no floats</text>
          <rect x="560" y="524" width="144" height="18" rx="9" fill="#052E2B"/>
          <text x="574" y="537" font-size="9.5" fill="#5EEAD4">statute &#167; cited in-repo</text>
        </g>
        <g>
          <rect x="56" y="556" width="660" height="30" rx="6" fill="#0F172A" stroke="#1E293B"/>
          <rect x="56" y="556" width="660" height="30" rx="6" fill="none" stroke="#34D399" opacity="0">
            <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.60;0.66;0.76;1" dur="8s" repeatCount="indefinite"/>
          </rect>
          <circle cx="74" cy="571" r="3.5" fill="#34D399"/>
          <text x="92" y="575" fill="#CBD5E1">net-worth consistency check across years</text>
          <rect x="560" y="562" width="144" height="18" rx="9" fill="#052E2B"/>
          <text x="574" y="575" font-size="9.5" fill="#5EEAD4">statute &#167; cited in-repo</text>
        </g>
        <g>
          <rect x="56" y="594" width="660" height="24" rx="6" fill="#0F172A" stroke="#1E293B"/>
          <rect x="56" y="594" width="660" height="24" rx="6" fill="none" stroke="#34D399" opacity="0">
            <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.80;0.86;0.96;1" dur="8s" repeatCount="indefinite"/>
          </rect>
          <circle cx="74" cy="606" r="3.5" fill="#34D399"/>
          <text x="92" y="610" fill="#CBD5E1">final settlement + advance for next period</text>
        </g>
      </g>
    </g>

    <!-- output + golden test -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="760" y="380" width="404" height="248" rx="12" fill="#0B1120" stroke="#1E293B"/>
      <text x="782" y="406" font-size="13.5" font-weight="600" fill="#E2E8F0">Filled form, box by box</text>

      <g>
        <rect x="782" y="422" width="176" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
        <rect x="782" y="422" width="0" height="22" rx="4" fill="#0F2A24">
          <animate attributeName="width" values="0;176" dur="0.5s" begin="0.4s" fill="freeze"/>
        </rect>
        <text x="794" y="437" font-size="10" fill="#94A3B8">gross income</text>
        <rect x="968" y="422" width="176" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
        <rect x="968" y="422" width="0" height="22" rx="4" fill="#0F2A24">
          <animate attributeName="width" values="0;176" dur="0.5s" begin="0.8s" fill="freeze"/>
        </rect>
        <text x="980" y="437" font-size="10" fill="#94A3B8">exempt income</text>

        <rect x="782" y="452" width="176" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
        <rect x="782" y="452" width="0" height="22" rx="4" fill="#0F2A24">
          <animate attributeName="width" values="0;176" dur="0.5s" begin="1.2s" fill="freeze"/>
        </rect>
        <text x="794" y="467" font-size="10" fill="#94A3B8">deductions</text>
        <rect x="968" y="452" width="176" height="22" rx="4" fill="#0F172A" stroke="#1E293B"/>
        <rect x="968" y="452" width="0" height="22" rx="4" fill="#0F2A24">
          <animate attributeName="width" values="0;176" dur="0.5s" begin="1.6s" fill="freeze"/>
        </rect>
        <text x="980" y="467" font-size="10" fill="#94A3B8">taxable base</text>

        <rect x="782" y="482" width="362" height="30" rx="4" fill="#0F172A" stroke="#065F46"/>
        <rect x="782" y="482" width="0" height="30" rx="4" fill="#052E2B">
          <animate attributeName="width" values="0;362" dur="0.7s" begin="2s" fill="freeze"/>
        </rect>
        <text x="794" y="501" font-size="11" fill="#5EEAD4" opacity="0">
          tax due &#183; computed, reproducible, explainable
          <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze"/>
        </text>
      </g>

      <!-- golden test seal -->
      <g>
        <rect x="782" y="528" width="362" height="80" rx="10" fill="#0F172A" stroke="#92400E"/>
        <circle cx="812" cy="556" r="11" fill="none" stroke="#FBBF24" stroke-width="1.6"/>
        <path d="M806 556 L810 561 L818 550" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <text x="834" y="552" font-size="11.5" font-weight="600" fill="#FDE68A">The golden test</text>
        <text x="834" y="570" font-size="10.5" fill="#94A3B8">a real filing reproduced box by box</text>
        <text x="834" y="590" font-size="10.5" fill="#94A3B8">if a change breaks it, the change is wrong</text>
      </g>
    </g>
  </g>
</svg>
