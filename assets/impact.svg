<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Impact metrics: alert noise reduction, agent tooling, automated tests, one-click delivery and zero persisted credentials">
  <title>Impact at a glance</title>

  <defs>
    <linearGradient id="iBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <linearGradient id="iB1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#60A5FA"/></linearGradient>
    <linearGradient id="iB2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0E7490"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="iB3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5B21B6"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="iB4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#065F46"/><stop offset="100%" stop-color="#34D399"/></linearGradient>
    <linearGradient id="iB5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#92400E"/><stop offset="100%" stop-color="#FBBF24"/></linearGradient>
    <filter id="iGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="iClip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#iClip)">
    <rect width="1200" height="300" fill="url(#iBg)"/>
    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#1E293B"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="32" y="46" font-size="10.5" fill="#475569">IMPACT &#183; WHAT THE WORK ACTUALLY MOVED</text>
      <line x1="32" y1="58" x2="1168" y2="58" stroke="#1E293B"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

      <!-- card 1 -->
      <g>
        <rect x="24" y="82" width="208" height="176" rx="12" fill="#0F172A" stroke="#1E293B"/>
        <text x="46" y="146" font-size="40" font-weight="700" fill="#93C5FD" filter="url(#iGlow)" opacity="0">
          85%+
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/>
        </text>
        <text x="46" y="176" font-size="11.5" fill="#CBD5E1">less alert noise</text>
        <text x="46" y="194" font-size="10" fill="#64748B">AI triage in front of</text>
        <text x="46" y="208" font-size="10" fill="#64748B">the on-call rotation</text>
        <rect x="46" y="228" width="164" height="6" rx="3" fill="#111827"/>
        <rect x="46" y="228" width="0" height="6" rx="3" fill="url(#iB1)">
          <animate attributeName="width" values="0;150" dur="1.4s" begin="0.3s" fill="freeze"/>
        </rect>
      </g>

      <!-- card 2 -->
      <g>
        <rect x="258" y="82" width="208" height="176" rx="12" fill="#0F172A" stroke="#1E293B"/>
        <text x="280" y="146" font-size="40" font-weight="700" fill="#67E8F9" filter="url(#iGlow)" opacity="0">
          20+
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" fill="freeze"/>
        </text>
        <text x="280" y="176" font-size="11.5" fill="#CBD5E1">agent tools, live</text>
        <text x="280" y="194" font-size="10" fill="#64748B">cluster, gateway, metrics,</text>
        <text x="280" y="208" font-size="10" fill="#64748B">logs, traces, memory</text>
        <rect x="280" y="228" width="164" height="6" rx="3" fill="#111827"/>
        <rect x="280" y="228" width="0" height="6" rx="3" fill="url(#iB2)">
          <animate attributeName="width" values="0;138" dur="1.4s" begin="0.6s" fill="freeze"/>
        </rect>
      </g>

      <!-- card 3 -->
      <g>
        <rect x="492" y="82" width="208" height="176" rx="12" fill="#0F172A" stroke="#1E293B"/>
        <text x="514" y="146" font-size="40" font-weight="700" fill="#C4B5FD" filter="url(#iGlow)" opacity="0">
          200+
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.9s" fill="freeze"/>
        </text>
        <text x="514" y="176" font-size="11.5" fill="#CBD5E1">automated tests</text>
        <text x="514" y="194" font-size="10" fill="#64748B">unit, integration and</text>
        <text x="514" y="208" font-size="10" fill="#64748B">architecture, gating CI</text>
        <rect x="514" y="228" width="164" height="6" rx="3" fill="#111827"/>
        <rect x="514" y="228" width="0" height="6" rx="3" fill="url(#iB3)">
          <animate attributeName="width" values="0;158" dur="1.4s" begin="0.9s" fill="freeze"/>
        </rect>
      </g>

      <!-- card 4 -->
      <g>
        <rect x="726" y="82" width="208" height="176" rx="12" fill="#0F172A" stroke="#1E293B"/>
        <text x="748" y="146" font-size="40" font-weight="700" fill="#6EE7B7" filter="url(#iGlow)" opacity="0">
          1 click
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.2s" fill="freeze"/>
        </text>
        <text x="748" y="176" font-size="11.5" fill="#CBD5E1">tag &#8594; prod &#8594; rollback</text>
        <text x="748" y="194" font-size="10" fill="#64748B">an eight-step manual</text>
        <text x="748" y="208" font-size="10" fill="#64748B">ritual, now self-service</text>
        <rect x="748" y="228" width="164" height="6" rx="3" fill="#111827"/>
        <rect x="748" y="228" width="0" height="6" rx="3" fill="url(#iB4)">
          <animate attributeName="width" values="0;164" dur="1.4s" begin="1.2s" fill="freeze"/>
        </rect>
      </g>

      <!-- card 5 -->
      <g>
        <rect x="960" y="82" width="208" height="176" rx="12" fill="#0F172A" stroke="#1E293B"/>
        <text x="982" y="146" font-size="40" font-weight="700" fill="#FCD34D" filter="url(#iGlow)" opacity="0">
          zero
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.5s" fill="freeze"/>
        </text>
        <text x="982" y="176" font-size="11.5" fill="#CBD5E1">credentials persisted</text>
        <text x="982" y="194" font-size="10" fill="#64748B">ephemeral sessions in an</text>
        <text x="982" y="208" font-size="10" fill="#64748B">isolated, DB-less worker</text>
        <rect x="982" y="228" width="164" height="6" rx="3" fill="#111827"/>
        <rect x="982" y="228" width="0" height="6" rx="3" fill="url(#iB5)">
          <animate attributeName="width" values="0;164" dur="1.4s" begin="1.5s" fill="freeze"/>
        </rect>
      </g>
    </g>

    <!-- sweep -->
    <rect x="-300" y="82" width="220" height="176" fill="#38BDF8" opacity="0.05">
      <animate attributeName="x" values="-300;1250" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
