<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="{{agentloop.aria}}">
  <title>{{agentloop.title}}</title>

  <defs>
    <linearGradient id="aBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0C1526"/>
    </linearGradient>
    <linearGradient id="aFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="aGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <clipPath id="aClip"><rect width="1200" height="660" rx="18"/></clipPath>

    <path id="aTrack" d="M184 232 L224 232 M392 232 L432 232 M608 232 L648 232 M824 232 L864 232 M1012 232 L1052 232"/>
    <path id="aFeedback" d="M1108 288 C1108 380, 780 406, 566 398 C500 392, 496 330, 516 296"/>
    <path id="aMain" d="M60 232 L1160 232"/>
  </defs>

  <g clip-path="url(#aClip)">
    <rect width="1200" height="660" fill="url(#aBg)"/>
    <rect x="0.5" y="0.5" width="1199" height="659" rx="18" fill="none" stroke="#1E293B"/>

    <!-- header -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <circle cx="40" cy="42" r="5" fill="#F87171"/>
      <circle cx="58" cy="42" r="5" fill="#FBBF24"/>
      <circle cx="76" cy="42" r="5" fill="#34D399"/>
      <text x="98" y="47" font-size="14" fill="#64748B">{{agentloop.t1}}</text>
      <text x="36" y="88" font-size="22" font-weight="700" fill="#E2E8F0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">{{agentloop.t2}}</text>
      <text x="36" y="112" font-size="13" fill="#64748B">{{agentloop.t3}}</text>
    </g>

    <!-- live operator question -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <rect x="36" y="132" width="1128" height="34" rx="8" fill="#0F172A" stroke="#1E293B"/>
      <text x="50" y="154" fill="#34D399">{{agentloop.t4}}</text>
      <text x="68" y="154" fill="#94A3B8" opacity="0">{{agentloop.t5}}
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.30;0.34;1" dur="20s" repeatCount="indefinite"/>
      </text>
      <text x="68" y="154" fill="#94A3B8" opacity="0">{{agentloop.t6}}
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.38;0.63;0.67;1" dur="20s" repeatCount="indefinite"/>
      </text>
      <text x="68" y="154" fill="#94A3B8" opacity="0">{{agentloop.t7}}
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.67;0.71;0.96;1" dur="20s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- connector rails -->
    <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#aArrow)">
      <path d="M184 232 L218 232"/>
      <path d="M392 232 L426 232"/>
      <path d="M608 232 L642 232"/>
      <path d="M824 232 L858 232"/>
      <path d="M1012 232 L1046 232"/>
    </g>

    <!-- flowing packet along the whole chain -->
    <circle r="4.5" fill="#22D3EE" filter="url(#aGlow)" opacity="0.95">
      <animateMotion dur="6.5s" repeatCount="indefinite" path="M60 232 L1160 232"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#60A5FA" filter="url(#aGlow)" opacity="0.8">
      <animateMotion dur="6.5s" begin="2.1s" repeatCount="indefinite" path="M60 232 L1160 232"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6.5s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#A78BFA" filter="url(#aGlow)" opacity="0.8">
      <animateMotion dur="6.5s" begin="4.2s" repeatCount="indefinite" path="M60 232 L1160 232"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="6.5s" begin="4.2s" repeatCount="indefinite"/>
    </circle>

    <!-- ============ stage boxes ============ -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

      <!-- A: operator -->
      <g>
        <rect x="36" y="188" width="148" height="88" rx="12" fill="#0F172A" stroke="#1E3A8A"/>
        <rect x="36" y="188" width="148" height="88" rx="12" fill="none" stroke="#3B82F6" opacity="0">
          <animate attributeName="opacity" values="0;0.9;0;0" dur="6.5s" keyTimes="0;0.05;0.14;1" repeatCount="indefinite"/>
        </rect>
        <text x="52" y="214" font-size="11" fill="#3B82F6">{{agentloop.t8}}</text>
        <text x="52" y="234" font-size="13" font-weight="600" fill="#E2E8F0">{{agentloop.t9}}</text>
        <text x="52" y="252" font-size="10.5" fill="#64748B">{{agentloop.t10}}</text>
        <text x="52" y="266" font-size="10.5" fill="#64748B">{{agentloop.t11}}</text>
      </g>

      <!-- B: context -->
      <g>
        <rect x="224" y="188" width="168" height="88" rx="12" fill="#0F172A" stroke="#155E75"/>
        <rect x="224" y="188" width="168" height="88" rx="12" fill="none" stroke="#22D3EE" opacity="0">
          <animate attributeName="opacity" values="0;0.9;0;0" dur="6.5s" keyTimes="0;0.22;0.31;1" repeatCount="indefinite"/>
        </rect>
        <text x="240" y="214" font-size="11" fill="#22D3EE">{{agentloop.t12}}</text>
        <text x="240" y="234" font-size="13" font-weight="600" fill="#E2E8F0">{{agentloop.t13}}</text>
        <text x="240" y="252" font-size="10.5" fill="#64748B">{{agentloop.t14}}</text>
        <text x="240" y="266" font-size="10.5" fill="#64748B">{{agentloop.t15}}</text>
      </g>

      <!-- C: planner -->
      <g>
        <rect x="432" y="188" width="176" height="88" rx="12" fill="#0F172A" stroke="#4C1D95"/>
        <rect x="432" y="188" width="176" height="88" rx="12" fill="none" stroke="#A78BFA" opacity="0">
          <animate attributeName="opacity" values="0;0.9;0;0" dur="6.5s" keyTimes="0;0.40;0.49;1" repeatCount="indefinite"/>
        </rect>
        <text x="448" y="214" font-size="11" fill="#A78BFA">{{agentloop.t16}}</text>
        <text x="448" y="234" font-size="13" font-weight="600" fill="#E2E8F0">{{agentloop.t17}}</text>
        <text x="448" y="252" font-size="10.5" fill="#64748B">{{agentloop.t18}}</text>
        <text x="448" y="266" font-size="10.5" fill="#64748B">{{agentloop.t19}}</text>
        <!-- thinking dots -->
        <g fill="#A78BFA">
          <circle cx="572" cy="208" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle>
          <circle cx="582" cy="208" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></circle>
          <circle cx="592" cy="208" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
        </g>
      </g>

      <!-- D: tools -->
      <g>
        <rect x="648" y="188" width="176" height="88" rx="12" fill="#0F172A" stroke="#065F46"/>
        <rect x="648" y="188" width="176" height="88" rx="12" fill="none" stroke="#34D399" opacity="0">
          <animate attributeName="opacity" values="0;0.9;0;0" dur="6.5s" keyTimes="0;0.58;0.67;1" repeatCount="indefinite"/>
        </rect>
        <text x="664" y="214" font-size="11" fill="#34D399">{{agentloop.t20}}</text>
        <text x="664" y="234" font-size="13" font-weight="600" fill="#E2E8F0">{{agentloop.t21}}</text>
        <text x="664" y="252" font-size="10.5" fill="#64748B">{{agentloop.t22}}</text>
        <text x="664" y="266" font-size="10.5" fill="#64748B">{{agentloop.t23}}</text>
      </g>

      <!-- E: guardrail -->
      <g>
        <rect x="864" y="188" width="148" height="88" rx="12" fill="#0F172A" stroke="#92400E"/>
        <rect x="864" y="188" width="148" height="88" rx="12" fill="none" stroke="#FBBF24" opacity="0">
          <animate attributeName="opacity" values="0;0.9;0;0" dur="6.5s" keyTimes="0;0.76;0.85;1" repeatCount="indefinite"/>
        </rect>
        <text x="880" y="214" font-size="11" fill="#FBBF24">{{agentloop.t24}}</text>
        <text x="880" y="234" font-size="13" font-weight="600" fill="#E2E8F0">{{agentloop.t25}}</text>
        <text x="880" y="252" font-size="10.5" fill="#64748B">{{agentloop.t26}}</text>
        <text x="880" y="266" font-size="10.5" fill="#64748B">{{agentloop.t27}}</text>
      </g>

      <!-- F: cluster -->
      <g>
        <rect x="1052" y="188" width="112" height="88" rx="12" fill="#0F172A" stroke="#1E40AF"/>
        <text x="1068" y="214" font-size="11" fill="#60A5FA">{{agentloop.t28}}</text>
        <text x="1068" y="234" font-size="13" font-weight="600" fill="#E2E8F0">{{agentloop.t29}}</text>
        <text x="1068" y="252" font-size="10.5" fill="#64748B">{{agentloop.t30}}</text>
        <text x="1068" y="266" font-size="10.5" fill="#64748B">{{agentloop.t31}}</text>
        <g>
          <circle cx="1148" cy="204" r="4" fill="#34D399"/>
          <circle cx="1148" cy="204" r="4" fill="none" stroke="#34D399">
            <animate attributeName="r" values="4;12" dur="2.2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>

    <!-- ============ feedback loop ============ -->
    <path d="M1108 288 C1108 380, 780 406, 566 398 C500 392, 496 330, 516 296" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#aArrow)"/>
    <circle r="4" fill="#FBBF24" filter="url(#aGlow)">
      <animateMotion dur="5s" repeatCount="indefinite">
        <mpath href="#aFeedback"/>
      </animateMotion>
    </circle>
    <text x="600" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#64748B">{{agentloop.t32}}</text>

    <!-- ============ tool chips cycling ============ -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
      <text x="36" y="448" fill="#475569">{{agentloop.t33}}</text>
      <g>
        <rect x="36" y="462" width="212" height="26" rx="6" fill="#0B1120" stroke="#1E293B"/>
        <circle cx="52" cy="475" r="3" fill="#34D399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="66" y="479" fill="#94A3B8">{{agentloop.t34}}</text>
      </g>
      <g>
        <rect x="260" y="462" width="149" height="26" rx="6" fill="#0B1120" stroke="#1E293B"/>
        <circle cx="276" cy="475" r="3" fill="#34D399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></circle>
        <text x="290" y="479" fill="#94A3B8">{{agentloop.t35}}</text>
      </g>
      <g>
        <rect x="421" y="462" width="130" height="26" rx="6" fill="#0B1120" stroke="#1E293B"/>
        <circle cx="437" cy="475" r="3" fill="#34D399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></circle>
        <text x="451" y="479" fill="#94A3B8">{{agentloop.t36}}</text>
      </g>
      <g>
        <rect x="563" y="462" width="137" height="26" rx="6" fill="#0B1120" stroke="#1E293B"/>
        <circle cx="579" cy="475" r="3" fill="#34D399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.9s" repeatCount="indefinite"/></circle>
        <text x="593" y="479" fill="#94A3B8">{{agentloop.t37}}</text>
      </g>
      <g>
        <rect x="712" y="462" width="168" height="26" rx="6" fill="#0B1120" stroke="#1E293B"/>
        <circle cx="728" cy="475" r="3" fill="#34D399"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
        <text x="742" y="479" fill="#94A3B8">{{agentloop.t38}}</text>
      </g>
      <g>
        <rect x="892" y="462" width="200" height="26" rx="6" fill="#0B1120" stroke="#1E293B"/>
        <circle cx="908" cy="475" r="3" fill="#FBBF24"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="1.5s" repeatCount="indefinite"/></circle>
        <text x="922" y="479" fill="#94A3B8">{{agentloop.t39}}</text>
      </g>
    </g>

    <!-- ============ approval gate ============ -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="36" y="504" width="470" height="150" rx="12" fill="#0B1120" stroke="#1E293B"/>
      <text x="56" y="530" font-size="11" fill="#FBBF24">{{agentloop.t40}}</text>

      <text x="56" y="556" font-size="12" fill="#94A3B8">{{agentloop.t41}}</text>
      <rect x="56" y="568" width="430" height="28" rx="6" fill="#111827" stroke="#334155"/>
      <text x="70" y="586" font-size="11" fill="#E2E8F0">{{agentloop.t42}}</text>

      <!-- approve bar filling -->
      <rect x="56" y="610" width="200" height="24" rx="12" fill="#0F172A" stroke="#065F46"/>
      <rect x="58" y="612" width="0" height="20" rx="10" fill="#065F46" opacity="0.55">
        <animate attributeName="width" values="0;196;196;0;0" keyTimes="0;0.45;0.8;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text x="88" y="626" font-size="11" fill="#A7F3D0">{{agentloop.t43}}</text>

      <rect x="272" y="610" width="120" height="24" rx="12" fill="#0F172A" stroke="#7F1D1D"/>
      <text x="300" y="626" font-size="11" fill="#FCA5A5">{{agentloop.t44}}</text>

      <text x="404" y="626" font-size="10.5" fill="#475569">{{agentloop.t45}}</text>
      <circle cx="470" cy="622" r="4" fill="#34D399">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============ safety rails ============ -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <rect x="530" y="504" width="634" height="150" rx="12" fill="#0B1120" stroke="#1E293B"/>
      <text x="550" y="530" font-size="11" fill="#F87171">{{agentloop.t46}}</text>

      <g fill="#94A3B8">
        <circle cx="556" cy="554" r="3" fill="#F87171"/>
        <text x="570" y="558">{{agentloop.t47}}</text>

        <circle cx="556" cy="580" r="3" fill="#F87171"/>
        <text x="570" y="584">{{agentloop.t48}}</text>

        <circle cx="556" cy="606" r="3" fill="#FBBF24"/>
        <text x="570" y="610">{{agentloop.t49}}</text>

        <circle cx="556" cy="632" r="3" fill="#34D399"/>
        <text x="570" y="636">{{agentloop.t50}}</text>
      </g>

      <!-- redaction animation -->
      <g>
        <rect x="960" y="546" width="184" height="24" rx="6" fill="#111827" stroke="#334155"/>
        <text x="972" y="563" font-size="10.5" fill="#64748B" opacity="0">{{agentloop.t51}}
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.35;0.42;1" dur="5s" repeatCount="indefinite"/>
      </text>
        <text x="972" y="563" font-size="10.5" fill="#F87171" opacity="0">{{agentloop.t52}}
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.95;1" dur="5s" repeatCount="indefinite"/>
      </text>
      </g>
    </g>
  </g>
</svg>
