<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 218" width="1000" height="218" role="img" aria-label="Generado desde la API de GitHub por un workflow programado en este repositorio &#8212; sin servicios de im&#225;genes de terceros que se puedan caer.">
  <title>Actividad</title>
  <defs>
    <linearGradient id="ghBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <radialGradient id="ghGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ghClip"><rect width="1000" height="218" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#ghClip)">
    <rect width="1000" height="218" fill="url(#ghBg)"/>
    <ellipse cx="780" cy="-40" rx="420" ry="220" fill="url(#ghGlow)">
      <animate attributeName="cx" values="780;500;780" dur="19s" repeatCount="indefinite"/>
    </ellipse>
<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#38BDF8" letter-spacing="1.6">GITHUB</text>
<text x="40" y="96" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#E2E8F0" font-weight="700">Actividad</text>
<rect x="40" y="108" width="155.15" height="3" rx="1.5" fill="#38BDF8" opacity="0.85"><animate attributeName="width" values="0;155.15" dur="1.1s" fill="freeze"/></rect>
<text x="40" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#64748B">Generado desde la API de GitHub por un workflow programado en este repositorio &#8212; sin servicios de im&#225;genes de</text>
<text x="40" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#64748B">terceros que se puedan caer.</text>
    <rect x="0.5" y="0.5" width="999" height="217" rx="16" fill="none" stroke="#1E293B"/>
  </g>
</svg>
