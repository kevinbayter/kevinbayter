<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 721" width="1000" height="721" role="img" aria-label="Where a hallucination is a legal problem. A tax-filing platform where the AI does exactly one job &#8212; reading messy documents &#8212; and is structurally prevented from doing the other one. The core decision: the model never computes the number.">
  <title>Where a hallucination is a legal problem</title>
  <defs>
    <linearGradient id="c2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <radialGradient id="c2Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c2Clip"><rect width="1000" height="721" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c2Clip)">
    <rect width="1000" height="721" fill="url(#c2Bg)"/>
    <ellipse cx="780" cy="-40" rx="420" ry="220" fill="url(#c2Glow)">
      <animate attributeName="cx" values="780;500;780" dur="19s" repeatCount="indefinite"/>
    </ellipse>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#34D399" letter-spacing="1.6">03 &#183; AI IN A REGULATED DOMAIN</text>
<text x="40" y="86" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#E2E8F0" font-weight="700">Where a hallucination is a legal problem</text>
<rect x="40" y="126" width="96" height="3" rx="1.5" fill="#34D399" opacity="0.85"><animate attributeName="width" values="0;96" dur="1s" fill="freeze"/></rect>
<text x="40" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">A tax-filing platform where the AI does exactly one job &#8212; reading messy documents &#8212; and is</text>
<text x="40" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">structurally prevented from doing the other one. The core decision: the model never computes</text>
<text x="40" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">the number.</text>
<circle cx="45" cy="262" r="4" fill="#34D399"/>
<text x="70" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">Dual-pass extraction.</text>
<text x="274.6" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">Every document is read twice, independently; disagreements surface</text>
<text x="70" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">first, with the source, for the user to resolve.</text>
<circle cx="45" cy="327" r="4" fill="#34D399"/>
<text x="70" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">Human confirmation is a hard gate.</text>
<text x="395.5" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">No extracted value advances until a person confirms it.</text>
<circle cx="45" cy="367" r="4" fill="#34D399"/>
<text x="70" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">A pure calculation core with zero dependencies.</text>
<text x="516.4" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">Every rule carries the citation that backs</text>
<text x="70" y="397" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">it, checked into the repo next to the code.</text>
<circle cx="45" cy="432" r="4" fill="#34D399"/>
<text x="70" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">A golden test as the contract.</text>
<text x="358.3" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">A real filing reproduced box by box: if a change breaks it,</text>
<text x="70" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">the change is wrong &#8212; unless a newly documented rule says otherwise.</text>
<circle cx="45" cy="497" r="4" fill="#34D399"/>
<text x="70" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">Credentials that can&#8217;t leak because they never exist at rest.</text>
<text x="646.6" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">Portal automation runs in an</text>
<text x="70" y="527" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">isolated worker with no database access, on ephemeral in-memory sessions destroyed in a</text>
<text x="70" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">guaranteed finally.</text>
<circle cx="45" cy="587" r="4" fill="#34D399"/>
<text x="70" y="592" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">Integer arithmetic end to end.</text>
<text x="358.3" y="592" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">No floats anywhere near money.</text>
<rect x="40" y="633" width="60.5" height="22" rx="11" fill="#111827" stroke="#1E293B"/>
<text x="53" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#34D399">STACK</text>
<text x="112.5" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#64748B">TypeScript &#183; Next.js &#183; Turborepo &#183; Prisma/PostgreSQL &#183; Playwright &#183; OpenAI-compatible LLM adapter</text>
<text x="112.5" y="669" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#64748B">(swapping providers is one env var) &#183; Vitest</text>
    <rect x="0.5" y="0.5" width="999" height="720" rx="16" fill="none" stroke="#1E293B"/>
  </g>
</svg>
