<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 263" width="1000" height="263" role="img" aria-label="The stack I actually build with. Anyone can call an API. The interesting engineering is everything below the call: bounding what an agent can do, proving what it did, and keeping the irreversible decisions in deterministic code.">
  <title>The stack I actually build with</title>
  <defs>
    <linearGradient id="asBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <radialGradient id="asGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="asClip"><rect width="1000" height="263" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#asClip)">
    <rect width="1000" height="263" fill="url(#asBg)"/>
    <ellipse cx="780" cy="-40" rx="420" ry="220" fill="url(#asGlow)">
      <animate attributeName="cx" values="780;500;780" dur="19s" repeatCount="indefinite"/>
    </ellipse>
<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A78BFA" letter-spacing="1.6">AI ENGINEERING</text>
<text x="40" y="96" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#E2E8F0" font-weight="700">The stack I actually build with</text>
<rect x="40" y="108" width="514.85" height="3" rx="1.5" fill="#A78BFA" opacity="0.85"><animate attributeName="width" values="0;514.85" dur="1.1s" fill="freeze"/></rect>
<text x="40" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">Anyone can call an API. The interesting engineering is everything below the call: bounding what</text>
<text x="40" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">an agent can do, proving what it did, and keeping the irreversible decisions in deterministic</text>
<text x="40" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">code.</text>
    <rect x="0.5" y="0.5" width="999" height="262" rx="16" fill="none" stroke="#1E293B"/>
  </g>
</svg>
