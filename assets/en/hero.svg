<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Kevin Bayter &#8212; Tech Lead and AI Engineer">
  <title>Kevin Bayter &#8212; Tech Lead &#183; AI Engineer</title>

  <defs>
    <linearGradient id="hBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111C36"/>
    </linearGradient>

    <linearGradient id="hName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="55%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="hSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hBlobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hBlobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hBlobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>

    <clipPath id="hClip">
      <rect x="0" y="0" width="1200" height="340" rx="18"/>
    </clipPath>

    <filter id="hGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="hOrbit1" d="M1010 92 L1108 148 L1010 204 L912 148 Z"/>
    <path id="hOrbit2" d="M1010 128 L1058 176 L1010 224 L962 176 Z"/>
  </defs>

  <g clip-path="url(#hClip)">
    <rect width="1200" height="340" fill="url(#hBg)"/>

    <!-- drifting grid -->
    <g opacity="0.55">
      <rect x="-40" y="-40" width="1280" height="420" fill="url(#hGrid)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 40; 0 0" dur="18s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ambient light -->
    <ellipse cx="180" cy="70" rx="320" ry="200" fill="url(#hBlobA)">
      <animate attributeName="cx" values="180;300;180" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="300" rx="300" ry="180" fill="url(#hBlobB)">
      <animate attributeName="cy" values="300;220;300" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="640" cy="20" rx="260" ry="140" fill="url(#hBlobC)">
      <animate attributeName="cx" values="640;520;640" dur="21s" repeatCount="indefinite"/>
    </ellipse>

    <!-- scanline -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#hSweep)" opacity="0.7">
      <animate attributeName="y" values="-10;350;-10" dur="11s" repeatCount="indefinite"/>
    </rect>

    <!-- ================= left column ================= -->
    <g transform="translate(64 0)">
      <!-- prompt line -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
        <text x="0" y="72" fill="#34D399">$</text>
        <text x="18" y="72" fill="#94A3B8">whoami</text>
        <rect x="86" y="60" width="9" height="16" fill="#34D399">
          <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- name -->
      <text x="0" y="146" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="url(#hName)" filter="url(#hGlow)">Kevin Bayter
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>

      <!-- animated underline -->
      <rect x="0" y="162" width="360" height="3" rx="1.5" fill="url(#hSweep)">
        <animate attributeName="width" values="0;360" dur="1.4s" begin="0.4s" fill="freeze"/>
      </rect>

      <!-- rotating roles -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600">
        <text x="0" y="206" fill="#60A5FA" opacity="0">AI Engineer &#183; agentic systems in production
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.22;0.25;1" dur="14s" repeatCount="indefinite"/>
      </text>
        <text x="0" y="206" fill="#22D3EE" opacity="0">Tech Lead &#183; payments &amp; platform modernization
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.47;0.5;1" dur="14s" repeatCount="indefinite"/>
      </text>
        <text x="0" y="206" fill="#A78BFA" opacity="0">Platform Engineer &#183; Kubernetes, GitOps, on-prem + cloud
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.72;0.75;1" dur="14s" repeatCount="indefinite"/>
      </text>
        <text x="0" y="206" fill="#34D399" opacity="0">Backend Engineer &#183; Java, Go, TypeScript, Kotlin
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.97;1" dur="14s" repeatCount="indefinite"/>
      </text>
      </g>

      <!-- chips -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
        <g>
          <rect x="0" y="234" width="170" height="28" rx="14" fill="#0F172A" stroke="#1E40AF" stroke-opacity="0.8"/>
          <circle cx="16" cy="248" r="3.5" fill="#60A5FA">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <text x="28" y="252" fill="#BFDBFE">LLM orchestration</text>
        </g>
        <g>
          <rect x="182" y="234" width="117" height="28" rx="14" fill="#0F172A" stroke="#0E7490" stroke-opacity="0.8"/>
          <circle cx="198" cy="248" r="3.5" fill="#22D3EE">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
          </circle>
          <text x="210" y="252" fill="#A5F3FC">Kubernetes</text>
        </g>
        <g>
          <rect x="311" y="234" width="102" height="28" rx="14" fill="#0F172A" stroke="#6D28D9" stroke-opacity="0.8"/>
          <circle cx="327" cy="248" r="3.5" fill="#A78BFA">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
          </circle>
          <text x="339" y="252" fill="#DDD6FE">Payments</text>
        </g>
        <g>
          <rect x="425" y="234" width="152" height="28" rx="14" fill="#0F172A" stroke="#047857" stroke-opacity="0.8"/>
          <circle cx="441" cy="248" r="3.5" fill="#34D399">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
          </circle>
          <text x="453" y="252" fill="#A7F3D0">Observability</text>
        </g>
      </g>

      <text x="0" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#475569">Bogot&#225;, Colombia &#8226; building systems that survive production</text>
    </g>

    <!-- ================= right column: live orchestration graph ================= -->
    <g transform="translate(0 -6)">
      <!-- edges -->
      <g stroke="#1E3A8A" stroke-width="1.4" fill="none" opacity="0.85">
        <path d="M1010 92 L1108 148"/>
        <path d="M1108 148 L1010 204"/>
        <path d="M1010 204 L912 148"/>
        <path d="M912 148 L1010 92"/>
        <path d="M1010 92 L1010 224"/>
        <path d="M912 148 L1108 148"/>
      </g>

      <!-- traveling packets -->
      <circle r="3.5" fill="#22D3EE" filter="url(#hGlow)">
        <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto">
          <mpath href="#hOrbit1"/>
        </animateMotion>
      </circle>
      <circle r="3" fill="#A78BFA" filter="url(#hGlow)">
        <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
          <mpath href="#hOrbit2"/>
        </animateMotion>
      </circle>
      <circle r="2.6" fill="#34D399" filter="url(#hGlow)">
        <animateMotion dur="4.5s" begin="2.2s" repeatCount="indefinite" rotate="auto">
          <mpath href="#hOrbit1"/>
        </animateMotion>
      </circle>

      <!-- nodes -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">
        <g>
          <circle cx="1010" cy="92" r="17" fill="#0F172A" stroke="#3B82F6" stroke-width="1.6"/>
          <circle cx="1010" cy="92" r="17" fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.6">
            <animate attributeName="r" values="17;30" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
          </circle>
          <text x="1010" y="96" fill="#93C5FD">LLM</text>
        </g>
        <g>
          <circle cx="1108" cy="148" r="17" fill="#0F172A" stroke="#22D3EE" stroke-width="1.6"/>
          <circle cx="1108" cy="148" r="17" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.6">
            <animate attributeName="r" values="17;30" dur="3s" begin="0.7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;0" dur="3s" begin="0.7s" repeatCount="indefinite"/>
          </circle>
          <text x="1108" y="152" fill="#A5F3FC">k8s</text>
        </g>
        <g>
          <circle cx="1010" cy="204" r="17" fill="#0F172A" stroke="#A78BFA" stroke-width="1.6"/>
          <circle cx="1010" cy="204" r="17" fill="none" stroke="#A78BFA" stroke-width="1.2" opacity="0.6">
            <animate attributeName="r" values="17;30" dur="3s" begin="1.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;0" dur="3s" begin="1.4s" repeatCount="indefinite"/>
          </circle>
          <text x="1010" y="208" fill="#DDD6FE">CI/CD</text>
        </g>
        <g>
          <circle cx="912" cy="148" r="17" fill="#0F172A" stroke="#34D399" stroke-width="1.6"/>
          <circle cx="912" cy="148" r="17" fill="none" stroke="#34D399" stroke-width="1.2" opacity="0.6">
            <animate attributeName="r" values="17;30" dur="3s" begin="2.1s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;0" dur="3s" begin="2.1s" repeatCount="indefinite"/>
          </circle>
          <text x="912" y="152" fill="#A7F3D0">obs</text>
        </g>
        <g>
          <circle cx="1010" cy="148" r="13" fill="#0B1120" stroke="#FBBF24" stroke-width="1.4"/>
          <circle cx="1010" cy="148" r="19" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.7">
            <animateTransform attributeName="transform" type="rotate" values="0 1010 148;360 1010 148" dur="14s" repeatCount="indefinite"/>
          </circle>
          <text x="1010" y="151" fill="#FDE68A" font-size="9">core</text>
        </g>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#1E293B"/>
  </g>
</svg>
