<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 681" width="1000" height="681" role="img" aria-label="The model proposes. The code decides.. I'm a Technical Lead and Senior Software Engineer who spends most of his time on the hardest version of the AI question: not &#8220;can a model do this?&#8221;, but &#8220;can I put this in front of production and sleep at night?&#8221; I build agentic systems that touch real infrastructure &#8212; clusters, gateways, pipelines, money &#8212; with the guardrails, approval gates, audit trails and deterministic cores that make them safe enough to actually ship. Alongside that, I modernize payment platforms and build the internal platforms other engineers deploy through. I lead by building: I write the hard parts, set the architecture, and make the boundaries enforceable so the design survives the team&#8217;s third sprint under pressure.">
  <title>The model proposes. The code decides.</title>
