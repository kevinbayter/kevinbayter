      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="waClip"><rect width="1000" height="681" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#waClip)">
