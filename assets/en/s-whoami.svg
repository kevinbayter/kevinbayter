<text x="40" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">production and sleep at night?&#8221;</text>
<text x="40" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">I build agentic systems that touch real infrastructure &#8212; clusters, gateways, pipelines, money &#8212;</text>
<text x="40" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">with the guardrails, approval gates, audit trails and deterministic cores that make them safe</text>
<text x="40" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">enough to actually ship. Alongside that, I modernize payment platforms and build the internal</text>
<text x="40" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">platforms other engineers deploy through.</text>
<text x="40" y="379" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">I lead by building: I write the hard parts, set the architecture, and make the boundaries</text>
<text x="40" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">enforceable so the design survives the team&#8217;s third sprint under pressure.</text>
