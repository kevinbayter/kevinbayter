    <ellipse cx="780" cy="-40" rx="420" ry="220" fill="url(#waGlow)">
      <animate attributeName="cx" values="780;500;780" dur="19s" repeatCount="indefinite"/>
    </ellipse>
<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#38BDF8" letter-spacing="1.6">WHOAMI</text>
