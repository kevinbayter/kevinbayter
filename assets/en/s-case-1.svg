<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 885" width="1000" height="885" role="img" aria-label="An LLM with its hands on production. An operational agent embedded in an internal platform. Ask it &#8220;why is this service returning 5xx?&#8221; and it doesn&#8217;t guess &#8212; it goes and looks: inspects workloads, reads gateway route definitions, queries metrics, logs and traces, correlates alerts, and comes back with evidence.">
  <title>An LLM with its hands on production</title>
  <defs>
    <linearGradient id="c0Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <radialGradient id="c0Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c0Clip"><rect width="1000" height="885" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c0Clip)">
    <rect width="1000" height="885" fill="url(#c0Bg)"/>
    <ellipse cx="780" cy="-40" rx="420" ry="220" fill="url(#c0Glow)">
      <animate attributeName="cx" values="780;500;780" dur="19s" repeatCount="indefinite"/>
    </ellipse>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A78BFA" letter-spacing="1.6">01 &#183; AGENTIC OPERATIONS</text>
<text x="40" y="86" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#E2E8F0" font-weight="700">An LLM with its hands on production</text>
<rect x="40" y="126" width="96" height="3" rx="1.5" fill="#A78BFA" opacity="0.85"><animate attributeName="width" values="0;96" dur="1s" fill="freeze"/></rect>
<text x="40" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">An operational agent embedded in an internal platform. Ask it &#8220;why is this service returning</text>
<text x="40" y="183" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">5xx?&#8221; and it doesn&#8217;t guess &#8212; it goes and looks: inspects workloads, reads gateway route</text>
<text x="40" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94A3B8">definitions, queries metrics, logs and traces, correlates alerts, and comes back with evidence.</text>
<text x="56" y="281" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#A78BFA" letter-spacing="1.2">PROBLEM</text>
<text x="442" y="281" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#A78BFA" letter-spacing="1.2">ENGINEERING DECISION</text>
<line x1="40" y1="293" x2="960" y2="293" stroke="#1E293B"/>
<rect x="40" y="293" width="920" height="94" fill="#0F172A" opacity="0.55"/>
<text x="56" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">An LLM with cluster access is a liability</text>
<text x="442" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">Every tool is risk-classified: reads execute immediately,</text>
<text x="442" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">writes become a pending action a human must confirm before</text>
<text x="442" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">anything runs</text>
<line x1="426" y1="293" x2="426" y2="387" stroke="#1E293B"/>
<line x1="40" y1="387" x2="960" y2="387" stroke="#1E293B"/>
<text x="56" y="415" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">&quot;Approved&quot; is not the same as &quot;safe&quot;</text>
<text x="442" y="415" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">A hard blocklist survives approval &#8212; mass deletions,</text>
<text x="442" y="437" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">protected namespaces, nodes, cluster roles and volumes are</text>
<text x="442" y="459" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">never executable</text>
<line x1="426" y1="387" x2="426" y2="481" stroke="#1E293B"/>
<line x1="40" y1="481" x2="960" y2="481" stroke="#1E293B"/>
<rect x="40" y="481" width="920" height="50" fill="#0F172A" opacity="0.55"/>
<text x="56" y="509" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">Tool output leaks secrets into context</text>
<text x="442" y="509" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">Output is redacted before it reaches the model, not after</text>
<line x1="426" y1="481" x2="426" y2="531" stroke="#1E293B"/>
<line x1="40" y1="531" x2="960" y2="531" stroke="#1E293B"/>
<text x="56" y="559" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">A single provider is a single point of</text>
<text x="56" y="581" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">failure</text>
<text x="442" y="559" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">Multi-provider routing with automatic failover,</text>
<text x="442" y="581" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">per-provider token budgets and iteration limits</text>
<line x1="426" y1="531" x2="426" y2="603" stroke="#1E293B"/>
<line x1="40" y1="603" x2="960" y2="603" stroke="#1E293B"/>
<rect x="40" y="603" width="920" height="72" fill="#0F172A" opacity="0.55"/>
<text x="56" y="631" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">Agents that &quot;think&quot; silently feel broken</text>
<text x="442" y="631" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">SSE streaming of partial text, live tool progress, and</text>
<text x="442" y="653" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">metric charts rendered inline in the conversation</text>
<line x1="426" y1="603" x2="426" y2="675" stroke="#1E293B"/>
<line x1="40" y1="675" x2="960" y2="675" stroke="#1E293B"/>
<text x="56" y="703" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">Agents forget what the last incident</text>
<text x="56" y="725" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">taught them</text>
<text x="442" y="703" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">A persistent operational memory the agent can write to,</text>
<text x="442" y="725" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#CBD5E1">recall from, and forget</text>
<line x1="426" y1="675" x2="426" y2="747" stroke="#1E293B"/>
<line x1="40" y1="747" x2="960" y2="747" stroke="#1E293B"/>
<rect x="40" y="763" width="60.5" height="22" rx="11" fill="#111827" stroke="#1E293B"/>
<text x="53" y="778" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#A78BFA">STACK</text>
<text x="112.5" y="778" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#64748B">TypeScript &#183; Node &#183; Prisma/PostgreSQL &#183; Redis + BullMQ &#183; MCP servers &#183; Kubernetes &#183; APISIX CRDs &#183;</text>
<text x="112.5" y="799" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#64748B">Prometheus &#183; Loki &#183; Grafana &#183; SSE</text>
<rect x="40" y="817" width="60.5" height="22" rx="11" fill="#111827" stroke="#1E293B"/>
<text x="53" y="832" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#A78BFA">SHAPE</text>
<text x="112.5" y="832" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#64748B">20+ typed tools &#183; bounded 14-iteration agent loop &#183; full audit trail per execution</text>
    <rect x="0.5" y="0.5" width="999" height="884" rx="16" fill="none" stroke="#1E293B"/>
  </g>
</svg>
