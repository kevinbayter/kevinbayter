<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 697" width="1000" height="697" role="img" aria-label="Cut production alert noise by 85%+ with AI-assisted triage in front of the on-call rotation &#8212; fewer pages, faster diagnosis, less burnout. Turned an eight-step manual release ritual into one click, with rollback available at every step and every action audited. Put an autonomous agent next to a live cluster &#8212; and made it safe. Reads run freely, writes stop at a human approval gate, destructive operations stay blocked no matter who approves. Made architecture a build failure, not a code-review opinion &#8212; layer boundaries verified by automated tests on every commit. Zero credentials persisted in a regulated flow that automates a government portal.">
  <title>Numbers, not adjectives</title>
  <defs>
    <linearGradient id="imBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <radialGradient id="imGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="imClip"><rect width="1000" height="697" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#imClip)">
