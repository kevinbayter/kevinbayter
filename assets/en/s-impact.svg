<text x="70" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">Turned an eight-step manual release ritual into one click,</text>
<text x="618.7" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">with rollback available at every</text>
<text x="70" y="465" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">step and every action audited.</text>
<circle cx="45" cy="501" r="4" fill="#A78BFA"/>
<text x="70" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">Put an autonomous agent next to a live cluster &#8212; and made it safe.</text>
<text x="693.1" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">Reads run freely, writes</text>
<text x="70" y="531" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">stop at a human approval gate, destructive operations stay blocked no matter who approves.</text>
