<text x="395.5" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">with AI-assisted triage in front of the on-call rotation &#8212;</text>
<text x="70" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">fewer pages, faster diagnosis, less burnout.</text>
