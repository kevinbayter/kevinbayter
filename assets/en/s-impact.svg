<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#34D399" letter-spacing="1.6">IMPACT &#183; WHAT THE WORK ACTUALLY MOVED</text>
