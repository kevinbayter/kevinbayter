<text x="70" y="572" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#CBD5E1" font-weight="600">Made architecture a build failure, not a code-review opinion</text>
<text x="637.3" y="572" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" fill="#94A3B8">&#8212; layer boundaries verified by</text>
