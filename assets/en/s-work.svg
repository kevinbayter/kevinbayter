<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 286" width="1000" height="286" role="img" aria-label="Employers are named because they are public. Internal project names, hostnames, schemas and business data are not &#8212; everything below describes architecture and engineering decisions, never a client&#8217;s internals.">
  <title>Three systems, three hard problems</title>
  <defs>
    <linearGradient id="wkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0A1524"/>
    </linearGradient>
    <radialGradient id="wkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="wkClip"><rect width="1000" height="286" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#wkClip)">
    <rect width="1000" height="286" fill="url(#wkBg)"/>
    <ellipse cx="780" cy="-40" rx="420" ry="220" fill="url(#wkGlow)">
      <animate attributeName="cx" values="780;500;780" dur="19s" repeatCount="indefinite"/>
    </ellipse>
<text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#A78BFA" letter-spacing="1.6">SELECTED WORK</text>
<text x="40" y="96" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#E2E8F0" font-weight="700">Three systems, three hard problems</text>
<rect x="40" y="108" width="563.9" height="3" rx="1.5" fill="#A78BFA" opacity="0.85"><animate attributeName="width" values="0;563.9" dur="1.1s" fill="freeze"/></rect>
<rect x="40" y="148" width="920" height="106" rx="10" fill="#0F172A" stroke="#1E293B"/>
<rect x="40" y="148" width="4" height="106" fill="#FBBF24"/>
<text x="66" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">Employers are named because they are public. Internal project names, hostnames, schemas and business</text>
<text x="66" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">data are not &#8212; everything below describes architecture and engineering decisions, never a client&#8217;s</text>
<text x="66" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">internals.</text>
    <rect x="0.5" y="0.5" width="999" height="285" rx="16" fill="none" stroke="#1E293B"/>
  </g>
</svg>
